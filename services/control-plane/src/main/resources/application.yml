server:
  port: 39211
spring:
  application:
    name: tokensea-control-plane
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:39213/tokensea}
    username: ${SPRING_DATASOURCE_USERNAME:tokensea}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:39214}
      password: ${SPRING_DATA_REDIS_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
tokensea:
  jwt-secret: ${TOKENSEA_JWT_SECRET}
  crypto-key: ${TOKENSEA_CRYPTO_KEY}
  bootstrap-token: ${TOKENSEA_BOOTSTRAP_TOKEN:}
  default-admin:
    enabled: ${TOKENSEA_DEFAULT_ADMIN_ENABLED:true}
    username: ${TOKENSEA_DEFAULT_ADMIN_USERNAME:admin}
    password: ${TOKENSEA_DEFAULT_ADMIN_PASSWORD:TokenSea@local2026}
    display-name: ${TOKENSEA_DEFAULT_ADMIN_DISPLAY_NAME:系统管理员}
  budget-currency: ${TOKENSEA_BUDGET_CURRENCY:CNY}
  fx:
    source-url: ${TOKENSEA_FX_SOURCE_URL:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
    managed-currencies: ${TOKENSEA_FX_MANAGED_CURRENCIES:USD}
    monthly-cron: ${TOKENSEA_FX_MONTHLY_CRON:0 10 3 1 * *}
    recovery-cron: ${TOKENSEA_FX_RECOVERY_CRON:0 40 3 * * *}
    zone: ${TOKENSEA_FX_ZONE:Asia/Shanghai}
  provider:
    connection-test-valid-minutes: ${TOKENSEA_CONNECTION_TEST_VALID_MINUTES:10080}
  cors:
    allowed-origins: ${TOKENSEA_CORS_ALLOWED_ORIGINS:http://localhost:39210}
  egress:
    proxy-host: ${TOKENSEA_EGRESS_PROXY_HOST:}
    proxy-port: ${TOKENSEA_EGRESS_PROXY_PORT:18080}
    allowed-hosts: ${TOKENSEA_ALLOWED_EGRESS_HOSTS:}
    allowed-ports: ${TOKENSEA_EGRESS_ALLOWED_PORTS:80,443}
    policy-token: ${TOKENSEA_EGRESS_POLICY_TOKEN:}
  headless-fetcher:
    url: ${TOKENSEA_HEADLESS_FETCHER_URL:}
    token: ${TOKENSEA_HEADLESS_FETCHER_TOKEN:}
  reference-price:
    enabled: ${TOKENSEA_REFERENCE_PRICE_ENABLED:true}
    bootstrap-enabled: ${TOKENSEA_REFERENCE_PRICE_BOOTSTRAP_ENABLED:true}
    bootstrap-resource: ${TOKENSEA_REFERENCE_PRICE_BOOTSTRAP_RESOURCE:classpath:reference-prices/reference-price-bootstrap.json}
    immediate-sync-on-startup: ${TOKENSEA_REFERENCE_PRICE_IMMEDIATE_SYNC:true}
    default-schedule: ${TOKENSEA_REFERENCE_PRICE_SCHEDULE:P1D}
    stale-after-hours: ${TOKENSEA_REFERENCE_PRICE_STALE_AFTER_HOURS:168}
    hard-stale-after-hours: ${TOKENSEA_REFERENCE_PRICE_HARD_STALE_AFTER_HOURS:720}
    health-refresh-ms: ${TOKENSEA_REFERENCE_PRICE_HEALTH_REFRESH_MS:3600000}
  price-document-llm:
    enabled: ${TOKENSEA_PRICE_DOCUMENT_LLM_ENABLED:false}
    url: ${TOKENSEA_PRICE_DOCUMENT_LLM_URL:}
    model: ${TOKENSEA_PRICE_DOCUMENT_LLM_MODEL:}
    virtual-key: ${TOKENSEA_PRICE_DOCUMENT_LLM_VIRTUAL_KEY:${TOKENSEA_PRICE_DOCUMENT_LLM_API_KEY:}}
    max-chars: ${TOKENSEA_PRICE_DOCUMENT_LLM_MAX_CHARS:60000}
  provider-billing:
    scheduler-ms: ${TOKENSEA_PROVIDER_BILLING_SCHEDULER_MS:300000}
  local-test-upstream:
    enabled: ${TOKENSEA_LOCAL_TEST_UPSTREAM_ENABLED:false}
    hosts: ${TOKENSEA_LOCAL_TEST_UPSTREAM_HOSTS:}
  runtime:
    engine-url: ${TOKENSEA_RUNTIME_ENGINE_URL:http://localhost:39218}
    engine-key: ${TOKENSEA_RUNTIME_ENGINE_KEY}
